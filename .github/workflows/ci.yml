name: MOPAC_RS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  LD_LIBRARY_PATH: "/usr/local/lib"

jobs:
  check-and-test:
    name: Test & Audit Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install System Dependencies (Vulkan & Python)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev vulkan-tools libvulkan1 python3-numpy

      - name: Install OpenMOPAC Reference Oracle (v23.2.5)
        run: |
          curl -L -s https://github.com/openmopac/mopac/releases/download/v23.2.5/mopac-23.2.5-linux.tar.gz | sudo tar -xzf - -C /usr/local --strip-components=1
          sudo ldconfig
          which mopac
          mopac --version

      - name: Rustfmt Formatting Check
        run: cargo fmt --all -- --check

      - name: Workspace Compilation Check
        run: cargo check --workspace --all-targets

      - name: Clippy Linter Audit (Zero Warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Full Automated Scrutiny & Unit Tests
        run: cargo test --workspace --verbose

      - name: Build Optimized Release Binary
        run: cargo build --release --bin mopac

      - name: Smoke Test CLI Executable
        run: |
          cat << "MOP_EOF" > /tmp/water_ci_test.mop
          PM6 1SCF
          Water Smoke Test CI

          O  0.000000 0  0.000000 0  0.000000 0
          H  0.757000 0  0.586000 0  0.000000 0
          H -0.757000 0  0.586000 0  0.000000 0
          MOP_EOF
          ./target/release/mopac /tmp/water_ci_test.mop
          grep -i "FINAL HEAT OF FORMATION" /tmp/water_ci_test.out

      - name: Python Bindings Build & Verification
        run: |
          cargo build --release -p mopac_py
          python3 crates/mopac_py/tests/test_python_api.py

  benchmark-provenance:
    name: Benchmark Provenance Stamp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build & Install Wheel
        run: |
          pip install maturin
          maturin build --release -m crates/mopac_py/Cargo.toml
          pip install --no-index --find-links target/wheels mopac_py

      - name: Verify Provenance Stamps
        run: |
          python3 - <<'PYEOF'
          import tomllib, mopac_py, sys
          from pathlib import Path
          ws = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          assert mopac_py.__version__ == ws, f"wheel {mopac_py.__version__} != workspace {ws}"
          sys.path.insert(0, str(Path("benchmarks").resolve()))
          import provenance
          md = provenance.stamp_metadata()
          assert md["workspace_version"] == ws, f"metadata ws {md['workspace_version']} != {ws}"
          assert md["wheel_version"] == ws, f"metadata wheel {md['wheel_version']} != {ws}"
          print("benchmark provenance verified for", ws)
          PYEOF
