name: Release MOPAC_RS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies (Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev vulkan-tools libvulkan1

      - name: Build Optimized Release Binary
        env:
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/build --remap-path-prefix=/home/runner=/build"
        run: cargo build --release --bin mopac

      - name: Package Release Assets
        run: |
          strip target/release/mopac
          tar -czvf mopac-linux-x86_64.tar.gz -C target/release mopac
          sha256sum mopac-linux-x86_64.tar.gz > mopac-linux-x86_64.tar.gz.sha256

          # Build Debian / Ubuntu .deb package
          PKG_VER="${GITHUB_REF_NAME#v}"
          DEB_DIR="target/debian_pkg"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/doc/mopac"
          mkdir -p "$DEB_DIR/DEBIAN"

          cp target/release/mopac "$DEB_DIR/usr/bin/mopac"
          chmod 755 "$DEB_DIR/usr/bin/mopac"
          cp LICENSE "$DEB_DIR/usr/share/doc/mopac/copyright"
          cp README.md "$DEB_DIR/usr/share/doc/mopac/README.md"
          chmod 644 "$DEB_DIR/usr/share/doc/mopac/copyright" "$DEB_DIR/usr/share/doc/mopac/README.md"

          cat << EOF > "$DEB_DIR/DEBIAN/control"
Package: mopac
Version: $PKG_VER
Section: science
Priority: optional
Architecture: amd64
Depends: libc6, libvulkan1
Maintainer: zeph.sys <zeph.systems@gmail.com>
Homepage: https://github.com/zephsystems/mopac_rs
Description: Modern High-Performance Semi-Empirical Quantum Chemistry Engine in Rust
 MOPAC_RS is a pure Rust semi-empirical quantum chemistry engine providing
 canonical OpenMOPAC Fortran 90 parity for MNDO, AM1, PM3, RM1, PM6, PM7,
 MOZYME O(N), COSMO solvation, and Vulkan GPU acceleration.
EOF

          dpkg-deb --build "$DEB_DIR" "mopac_${PKG_VER}_amd64.deb"
          sha256sum "mopac_${PKG_VER}_amd64.deb" > "mopac_${PKG_VER}_amd64.deb.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_DRAFT.md
          files: |
            mopac-linux-x86_64.tar.gz
            mopac-linux-x86_64.tar.gz.sha256
            mopac_*_amd64.deb
            mopac_*_amd64.deb.sha256
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish to Crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            ./scripts/publish_crates.sh
          else
            echo "CARGO_REGISTRY_TOKEN is not configured; skipping crates.io publishing."
          fi
