name: Release MOPAC_RS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies (Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev vulkan-tools libvulkan1

      - name: Build Optimized Release Binary
        run: cargo build --release --bin mopac

      - name: Package Release Assets
        run: |
          strip target/release/mopac
          tar -czvf mopac-linux-x86_64.tar.gz -C target/release mopac
          sha256sum mopac-linux-x86_64.tar.gz > mopac-linux-x86_64.tar.gz.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mopac-linux-x86_64.tar.gz
            mopac-linux-x86_64.tar.gz.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
