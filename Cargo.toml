[workspace]
members = [
    "crates/mopac_core",
    "crates/mopac_gpu",
    "crates/mopac_cli",
    "crates/mopac_py",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["zeph.sys <zeph.systems@gmail.com>"]
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
